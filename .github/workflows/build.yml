name: Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & test
        run: mvn -B verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (push nur außerhalb von PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-Test — Container startet und antwortet
        run: |
          docker compose up -d postgres
          docker build -t summarizer-test .
          docker run -d --name smoke --network host \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5433/summarizer \
            -e SPRING_DATASOURCE_USERNAME=summarizer \
            -e SPRING_DATASOURCE_PASSWORD=summarizer \
            summarizer-test
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/login > /dev/null; then echo "OK"; exit 0; fi
            sleep 5
          done
          echo "Container antwortet nicht:"; docker logs smoke | tail -50; exit 1

      - name: Installer-Artefakte
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          cp docker-compose.yml .env.example INSTALL.md dist/
          cp install.ps1 install.sh install.bat dist/
          cp Setup-Summarizer.ps1 Setup-Summarizer.bat setup-summarizer.sh dist/
          cp Summarizer-Start.ps1 Summarizer-Start.bat summarizer-start.sh dist/
          cd dist && zip -r ../summarizer-installer.zip .

      - name: Release-Assets anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: summarizer-installer.zip
