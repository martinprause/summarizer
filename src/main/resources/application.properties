spring.application.name=summarizer

# --- Datenbank (Docker: docker compose up -d) ---
spring.datasource.url=jdbc:postgresql://localhost:5433/summarizer
spring.datasource.username=summarizer
spring.datasource.password=summarizer

# Schema gehoert Flyway, Hibernate validiert nur
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Vaadin ---
vaadin.launch-browser=true

# --- Auth ---
# Login: Benutzername/E-Mail + Passwort; abschaltbar unter System -> Zugriff.
summarizer.admin-password=${ADMIN_PASSWORD:}

# --- Ollama (lokal oder Container) ---
summarizer.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
summarizer.ollama.chat-model=${CHAT_MODEL:llama3.2:latest}
summarizer.ollama.embedding-model=${EMBEDDING_MODEL:nomic-embed-text}
# Vision-Modell fuer Bild-Beschreibung/OCR (llava:7b, llama3.2-vision, moondream)
summarizer.ollama.vision-model=${VISION_MODEL:llava:7b}
# Dimension des Embedding-Modells (nomic-embed-text: 768, bge-m3: 1024)
summarizer.embedding-dim=${EMBEDDING_DIM:768}


# --- Whisper (Audio-Transkription, Compose-Profil "whisper") ---
summarizer.whisper.base-url=${WHISPER_BASE_URL:http://localhost:9000}

# --- Datei-Ablage (Bilder etc.) ---
summarizer.files.dir=${FILES_DIR:./data/files}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# --- Pipeline-Thread-Pool (begrenzt, damit 500er-Importe das System nicht fluten) ---
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=10000
