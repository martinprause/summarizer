<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; }
        h1 { font-size: 1rem; margin: 0 0 8px; }
        #pageTitle { font-size: 0.85rem; color: #555; margin: 0 0 12px;
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        button { width: 100%; padding: 9px; margin-bottom: 8px; border: none; border-radius: 8px;
                 background: #1a73e8; color: white; font-size: 0.9rem; cursor: pointer; }
        button:disabled { background: #9e9e9e; }
        button.secondary { background: #eceff1; color: #263238; }
        #status { font-size: 0.85rem; min-height: 1.2em; }
        #status.ok { color: #2e7d32; }
        #status.error { color: #c62828; }
        a { font-size: 0.8rem; }
    </style>
</head>
<body>
    <h1>Summarizer</h1>
    <p id="pageTitle">…</p>
    <button id="savePage">Seite speichern</button>
    <button id="saveSelection" class="secondary">Markierten Text speichern</button>
    <p id="status"></p>
    <a href="#" id="openOptions">Einstellungen</a>
    <script type="module" src="popup.js"></script>
</body>
</html>
